<template>
  <div class="shell">
    <header class="gnb">
      <img class="brand" src={logoUrl} alt="CorePress" />
      <nav aria-label="랜딩 상단 메뉴">
        <a href={productsUrl}>제품</a>
        <a href={servicesUrl}>서비스</a>
        <a href={noticesUrl}>기술자료</a>
        <a class="active" href="#">회사소개</a>
      </nav>
      <a href={homeUrl} class="back-link">← 랜딩으로</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="tag">ABOUT COREPRESS</p>
          <h1>공정을 멈추지 않는 압축공기 파트너</h1>
          <p class="lead">
            CorePress는 산업용 터보압축기와 에어드라이어 설계·제조부터 설치, 정비, 부품, 원격 모니터링까지
            전 수명주기를 단일 파트너십으로 제공합니다. 반도체·석유화학·제철·2차전지 등 공정 정지가 곧
            비용이 되는 라인에 특화되어 있습니다.
          </p>
          <a class="cta" href={inquiryHref}>도입 · 도입검토 문의 <span aria-hidden="true">→</span></a>
        </div>
        <div class="hero-visual"><img src={heroImage} alt="CP7100+ 터보압축기" /></div>
      </section>

      <section class="stats" aria-label="CorePress 주요 지표">
        <template for:each={stats} for:item="s">
          <div class="stat" key={s.label}>
            <strong>{s.value}</strong>
            <span>{s.label}</span>
          </div>
        </template>
      </section>

      <section class="pillars">
        <header>
          <p class="tag">WHAT WE DO</p>
          <h2>CorePress를 선택하는 이유</h2>
        </header>
        <div class="pillar-grid">
          <template for:each={pillars} for:item="p">
            <article class="pillar" key={p.key}>
              <span class="icon" aria-hidden="true">{p.icon}</span>
              <span class="pillar-tag">{p.tag}</span>
              <h3>{p.title}</h3>
              <p>{p.body}</p>
            </article>
          </template>
        </div>
      </section>

      <section class="split">
        <div class="split-image"><img src={impellerImage} alt="터보압축기 임펠러" /></div>
        <div class="split-copy">
          <p class="tag">ENGINEERING FIRST</p>
          <h2>핵심 부품까지 자체 설계·제조</h2>
          <p>
            임펠러, 기어박스, 컨트롤러, 진동 센서 등 압축기 성능을 결정짓는 핵심 부품을 CorePress가 직접 설계하고
            공장에서 제조합니다. 표준 라인업 외에 라인 특성에 맞춘 커스텀 사양도 대응합니다.
          </p>
        </div>
      </section>

      <section class="split reverse">
        <div class="split-copy">
          <p class="tag">DIGITAL SERVICE</p>
          <h2>고객이 직접 관리하는 서비스 포털</h2>
          <p>
            CorePress 고객 포털에서 보유 설비 현황, 서비스 요청 이력, 견적, RFP/RFQ 진행 상황을 실시간으로 확인할 수 있습니다.
            원격 모니터링과 결합해 문제 발생 전 상태를 미리 파악합니다.
          </p>
        </div>
        <div class="split-image"><img src={controlImage} alt="CorePress 컨트롤 패널" /></div>
      </section>

      <section class="contact">
        <header>
          <p class="tag">CONTACT</p>
          <h2>문의 · 상담</h2>
        </header>
        <dl>
          <template for:each={contact} for:item="c">
            <div key={c.label}>
              <dt>{c.label}</dt>
              <dd>{c.value}</dd>
            </div>
          </template>
        </dl>
      </section>

      <footer class="cta-footer">
        <div>
          <strong>도입 검토를 시작하시겠어요?</strong>
          <p>라인 조건과 운전 시간을 알려주시면 담당 영업사원이 최적 라인업과 도입 방식을 제안드립니다.</p>
        </div>
        <a class="cta secondary" href={inquiryHref}>카탈로그 요청하기 <span aria-hidden="true">→</span></a>
      </footer>
    </main>
  </div>
</template>
