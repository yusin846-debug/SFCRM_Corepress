<template>
    <main class="page">
        <header class="header"><img src={headerLogoUrl} alt="CorePress"/><nav><a href={homeUrl}>홈</a><a href={assetListUrl}>보유 설비</a><span aria-current="page">서비스 요청</span><a href={rfpUrl}>RFP·RFQ</a><a href={quoteUrl}>견적</a></nav><div class="account">대한케미컬<span></span><button class="logout" type="button" onclick={handleLogout}><img src={logoutIconUrl} alt="" />로그아웃</button></div></header>
        <section class="content">
            <a class="back" href={requestListUrl}>← 서비스 요청 목록</a>

            <template if:true={isPreview}><aside class="data-notice" role="status">Builder 미리보기입니다. 실제 서비스 요청 상세는 목록에서 선택해 확인해 주세요.</aside></template>
            <template if:true={loadError}><aside class="data-notice error" role="alert">{loadError}</aside></template>

            <template if:true={hasCase}>
                <div class="title-row"><div><p>SERVICE REQUEST</p><h1>{caseNumber}</h1><span>{assetSummary}</span></div><div class="request-meta"><small>접수일</small><strong>{createdDate}</strong><b>{status}</b></div></div>

                <section class="progress" aria-label="서비스 처리 단계">
                    <template for:each={steps} for:item="step"><div key={step.label} class={step.className}><span>{step.number}</span><strong>{step.label}</strong></div></template>
                </section>

                <div class="detail-grid">
                    <div class="main-column">
                        <section class="panel"><header><p>01</p><h2>요청 정보</h2></header><div class="info-grid"><dl><dt>증상 유형</dt><dd>{type}</dd></dl><dl><dt>요청자</dt><dd>{contactName}</dd></dl><dl><dt>대상 설비</dt><dd>{assetSummary}</dd></dl></div><div class="description"><small>요청 내용</small><p>{description}</p></div></section>
                        <section class="panel"><header><p>02</p><h2>조치 결과</h2></header><template if:true={hasWorkPerformed}><div class="work-note"><small>조치 내용</small><p>{workPerformed}</p></div><template if:true={partsUsed}><div class="files"><span>{partsUsed}</span></div></template></template><template if:false={hasWorkPerformed}><div class="work-status"><div class="work-icon">↗</div><div><strong>아직 조치 결과가 등록되지 않았습니다</strong><p>담당 엔지니어의 현장 확인 후 업데이트됩니다.</p></div></div></template></section>
                    </div>
                    <aside>
                        <section class="side-panel"><p>WARRANTY</p><h2>보증 판정</h2><div class="warranty"><span>{warrantyDetermination}</span><strong>{determinationBasis}</strong></div><template if:false={isWarrantyCovered}><dl><div><dt>유상 사유</dt><dd>{billableReason}</dd></div><div><dt>견적 금액</dt><dd>{quotedAmount}</dd></div><div><dt>승인 상태</dt><dd>{approvalStatus}</dd></div></dl><template if:true={showApprovalActions}><template if:true={approvalActionError}><p class="approval-error" role="alert">{approvalActionError}</p></template><div class="approval-actions"><button type="button" class="approve" data-decision="승인" onclick={handleApprovalAction} disabled={isSubmittingApproval}>승인</button><button type="button" class="reject" data-decision="반려" onclick={handleApprovalAction} disabled={isSubmittingApproval}>반려</button></div></template></template></section>
                        <template if:true={hasScheduledVisit}>
                        <section class="side-panel visit"><p>VISIT SCHEDULE</p><h2>방문 정보</h2><div class="date"><strong>{visitDate}</strong></div><dl><div><dt>담당 엔지니어</dt><dd>{engineerName}</dd></div><div><dt>연락처</dt><dd>{engineerPhone}</dd></div></dl></section>
                        </template>
                    </aside>
                </div>
            </template>
        </section>
    </main>
</template>
