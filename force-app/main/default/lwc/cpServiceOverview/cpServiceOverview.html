<template>
  <div class="shell">
    <header class="gnb">
      <img class="brand" src={logoUrl} alt="CorePress" />
      <nav aria-label="랜딩 상단 메뉴">
        <a href={productsUrl}>제품</a>
        <a class="active" href="#">서비스</a>
        <a href={noticesUrl}>기술자료</a>
        <a href={aboutUrl}>회사소개</a>
      </nav>
      <a href={homeUrl} class="back-link">← 랜딩으로</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="tag">CORE SERVICE</p>
          <h1>공정을 멈추지 않는 CorePress 서비스</h1>
          <p class="lead">
            설치부터 정비, 부품 공급, 원격 모니터링까지 압축 공기 시스템 전 수명주기를 한 파트너와 관리합니다.
            서비스 계약은 라인 규모와 운전 조건에 따라 5개 상품을 조합할 수 있습니다.
          </p>
          <a class="cta" href={inquiryHref}>서비스 문의하기 <span aria-hidden="true">→</span></a>
        </div>
        <div class="hero-visual">
          <img src={sensorImage} alt="설비 상태 센서" />
        </div>
      </section>

      <section class="offerings" aria-label="CorePress 서비스 상품">
        <template for:each={offerings} for:item="item">
          <article class="offer" key={item.key}>
            <div class="offer-image"><img src={item.imageSrc} alt={item.title} /></div>
            <div class="offer-copy">
              <span class="offer-tag">{item.tag}</span>
              <h2>{item.title}</h2>
              <p class="offer-lead">{item.lead}</p>
              <p class="offer-body">{item.body}</p>
            </div>
          </article>
        </template>
      </section>

      <footer class="cta-footer">
        <div>
          <strong>지금 필요한 계약 조건이 있으신가요?</strong>
          <p>담당 영업사원이 라인 사양·운전 시간·기존 보증 조건을 함께 검토해 최적 상품을 제안드립니다.</p>
        </div>
        <a class="cta secondary" href={inquiryHref}>서비스 상담 요청 <span aria-hidden="true">→</span></a>
      </footer>
    </main>
  </div>
</template>
