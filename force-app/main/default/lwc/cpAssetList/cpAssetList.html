<template>
    <div class="shell">
        <header class="gnb">
            <img class="brand" src={logoUrl} alt="CorePress" />
            <nav aria-label="고객 포털 주요 메뉴">
                <a href="portal-home">홈</a><a class="active" href="asset-list">보유 설비</a><a href="service-requests">서비스 요청</a><a href="rfp-list">RFP·RFQ</a><a href="quotes">견적</a>
            </nav>
            <div class="user">대한케미컬 · 김유신 <span></span><a href="logout"><img src={logoutIconUrl} alt="" />로그아웃</a></div>
        </header>

        <main>
            <header class="page-heading">
                <h1>보유 설비</h1>
                <p>등록 설비 5대 <span></span><b>운전 중 4대</b><span></span><em>점검 필요 1대</em></p>
            </header>

            <section class="controls" aria-label="보유 설비 검색 및 필터">
                <label class="search"><span aria-hidden="true">⌕</span><input type="search" placeholder="설비명 또는 일련번호 검색" value={searchTerm} oninput={handleSearch} /></label>
                <div class="filters"><button class={allFilterClass} onclick={showAll}>전체 <b>5</b></button><button class={runningFilterClass} onclick={showRunning}>운전 중 <b>4</b></button><button class={attentionFilterClass} onclick={showAttention}>점검 필요 <b>1</b></button></div>
                <div class="view-toggle" aria-label="보기 방식"><button class={gridButtonClass} onclick={showGrid} aria-label="카드 보기">▦</button><button class={listButtonClass} onclick={showList} aria-label="목록 보기">☷</button></div>
            </section>

            <section class={gridClass} aria-label="보유 설비 목록">
                <template for:each={filteredAssets} for:item="asset">
                    <article class="asset-card" key={asset.id}>
                        <div class="machine"><img src={asset.imageUrl} alt={asset.name} /></div>
                        <div class="asset-copy">
                            <span class="model">{asset.model}</span><h2>{asset.name}</h2><p class="serial">{asset.serial}</p>
                            <p class="location"><img src={locationIconUrl} alt="" />{asset.location}</p>
                            <span class={asset.statusClass}><img src={asset.statusIcon} alt="" />{asset.status}</span>
                            <dl><dt>설치일</dt><dd>{asset.installDate}</dd></dl>
                            <a class="detail-link" href={detailUrl}>상세 보기 <span>→</span></a>
                        </div>
                    </article>
                </template>
            </section>

            <template if:false={filteredAssets.length}><section class="empty"><h2>조건에 맞는 설비가 없습니다</h2><p>검색어나 상태 필터를 다시 확인해 주세요.</p></section></template>
            <footer><span>1 / 1페이지</span><b>{resultsLabel}</b></footer>
        </main>
    </div>
</template>
