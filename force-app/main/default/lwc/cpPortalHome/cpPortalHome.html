<template>
  <div class="shell">
    <header class="cp-gnb">
      <img src={logoUrl} alt="CorePress" />
      <nav>
        <a class="active" href={homeUrl}>홈</a><a href={assetListUrl}>보유 설비</a
        ><a href={serviceUrl}>서비스 요청</a><a href={rfpUrl}>RFP·RFQ</a
        ><a href={quoteUrl}>견적</a>
      </nav>
      <div class="user">
        {headerLabel} <span></span
        ><button class="logout" type="button" onclick={handleLogout}
          ><img src={logoutIconUrl} alt="" />로그아웃</button
        >
      </div>
    </header>
    <main class="cp-page" id="home">
      <h1>{pageTitle}</h1>
      <section class="overview" id="assets">
        <div class="status">
          <h2>
            설비 현황
            <img class="info-icon" src={infoIconUrl} alt="설비 현황 안내" />
          </h2>
          <p>
            <i><img src={registeredIconUrl} alt="" /></i>등록 설비
            <strong>{totalAssetCount}<small>대</small></strong>
          </p>
          <p>
            <i><img src={operatingIconUrl} alt="" /></i>운전 중
            <strong>{runningAssetCount}<small>대</small></strong>
          </p>
          <p>
            <i><img src={warningIconUrl} alt="" /></i>점검 필요
            <strong>{attentionAssetCount}<small>대</small></strong>
          </p>
        </div>
        <div class="health">
          <h2>
            설비 건강도
            <img class="info-icon" src={infoIconUrl} alt="설비 건강도 안내" />
          </h2>
          <div class="ring" style={ringStyle}>
            <div>
              <small>설비 건강도</small><strong>{healthPercent}</strong
              ><span>{healthLabel}</span>
            </div>
          </div>
          <ul>
            <li>
              <img class="check-icon" src={completeIconUrl} alt="" />진동
              <b>양호</b>
            </li>
            <li>
              <img class="check-icon" src={completeIconUrl} alt="" />온도
              <b>양호</b>
            </li>
            <li>
              <img class="check-icon" src={completeIconUrl} alt="" />압력
              <b>양호</b>
            </li>
            <li>
              <img class="check-icon" src={completeIconUrl} alt="" />윤활유
              <b>양호</b>
            </li>
          </ul>
        </div>
        <div class="maintenance">
          <h2>
            예방정비 주기
            <img
              class="info-icon"
              src={infoIconUrl}
              alt="예방정비 주기 안내"
            />
          </h2>
          <p>다음 권장 정비까지</p>
          <strong>132<small>일</small></strong>
          <div class="gauge" aria-label="정비 주기 41퍼센트 경과">
            <div class="gauge-arc"></div>
            <span class="gauge-needle"></span>
            <span class="gauge-hub"></span>
          </div>
          <div class="gauge-summary">
            <span>경과 92일</span>
            <strong>남은 기간 132일</strong>
          </div>
          <div class="gauge-legend">
            <span class="recent">최근 정비 2026.05.18</span
            ><span class="next">다음 정비 2026.12.28</span>
          </div>
        </div>
        <div class="asset-health">
          <header>
            <h2>설비별 건강도 <img class="info-icon" src={infoIconUrl} alt="설비별 건강도 안내" /></h2>
            <a href={assetListUrl}>설비 전체 보기 <span>→</span></a>
          </header>
          <ul>
            <template for:each={topAssets} for:item="asset">
              <li key={asset.id}>
                <span class="asset-name"
                  ><b>{asset.name}</b><small>{asset.model}</small></span
                ><span class="score-track"
                  ><i class={asset.barClass} style={asset.scoreStyle}></i></span
                ><strong>{asset.score}</strong
                ><em class={asset.labelClass}>{asset.label}</em>
              </li>
            </template>
            <template if:false={hasAssets}>
              <li class="empty-row">등록된 설비가 없습니다.</li>
            </template>
          </ul>
        </div>
      </section>
      <section class="stepper" id="requests">
        <h2>
          서비스 요청 현황
          <img
            class="info-icon"
            src={infoIconUrl}
            alt="서비스 요청 현황 안내"
          />
        </h2>
        <div class="step">
          <i><img src={requestIconUrl} alt="" /></i
          ><span>접수<strong>{newCaseCount}</strong></span>
        </div>
        <b></b>
        <div class="step">
          <i><img src={assignedIconUrl} alt="" /></i
          ><span>배정<strong>{assignedCaseCount}</strong></span>
        </div>
        <b></b>
        <div class="step">
          <i><img src={workIconUrl} alt="" /></i
          ><span>작업 중<strong>{progressCaseCount}</strong></span>
        </div>
        <b></b>
        <div class="step">
          <i><img src={completeIconUrl} alt="" /></i
          ><span>완료<strong>{doneCaseCount}</strong></span>
        </div>
        <div class="step-actions">
          <a class="service-request-button" href={serviceListUrl}
            >서비스 요청 <span>→</span></a
          ><a class="asset-link" href={assetListUrl}
            >설비 전체 보기 <span>→</span></a
          >
        </div>
      </section>
      <section class="lower">
        <div>
          <h2>최근 서비스 요청</h2>
          <table>
            <thead>
              <tr>
                <th>요청번호</th>
                <th>설비명</th>
                <th>요청 내용</th>
                <th>상태</th>
                <th>요청일</th>
                <th>방문 예정</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={recentCases} for:item="request">
                <tr key={request.id}>
                  <td>{request.number}</td>
                  <td>{request.assetName}</td>
                  <td>{request.subject}</td>
                  <td><span class={request.badgeClass}>{request.status}</span></td>
                  <td>{request.createdDate}</td>
                  <td>{request.visitDate}</td>
                </tr>
              </template>
              <template if:false={hasRecentCases}>
                <tr>
                  <td colspan="6" class="empty-row">등록된 서비스 요청이 없습니다.</td>
                </tr>
              </template>
            </tbody>
          </table>
          <a class="link" href={serviceUrl}>서비스 요청 등록하기 →</a>
        </div>
        <div>
          <h2>공지 및 보증 안내</h2>
          <ul class="notices">
            <li>
              <i
                ><img
                  src={warrantyIconUrl}
                  alt=""
                  style="width: 24px; height: 24px; object-fit: contain" /></i
              ><span
                ><b>[보증] CP7100+ #1 보증 만료 60일 전 안내</b
                ><small>보증 만료 예정일 2026.10.17</small></span
              ><time>2026.08.18</time>
            </li>
            <li>
              <i
                ><img
                  src={infoIconUrl}
                  alt=""
                  style="width: 24px; height: 24px; object-fit: contain" /></i
              ><span
                ><b>[공지] 2026년 CorePress 정기 점검 캠페인 안내</b
                ><small>기간: 2026.09.01 - 2026.10.30</small></span
              ><time>2026.08.17</time>
            </li>
            <li>
              <i
                ><img
                  src={documentIconUrl}
                  alt=""
                  style="width: 24px; height: 24px; object-fit: contain" /></i
              ><span
                ><b>[기술자료] 터보압축기 이상 진동 원인 및 조치 가이드</b
                ><small>다운로드 가능</small></span
              ><time>2026.08.15</time>
            </li>
          </ul>
          <span class="link" aria-disabled="true">공지 전체보기 준비 중</span>
        </div>
      </section>
    </main>
  </div>
</template>
