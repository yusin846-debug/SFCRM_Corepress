<template>
  <div class="shell">
    <header class="gnb">
      <img class="brand" src={logoUrl} alt="CorePress" />
      <nav aria-label="고객 포털 주요 메뉴">
        <a href={homeUrl}>홈</a
        ><a class="active" href={assetListUrl}>보유 설비</a
        ><a href={serviceListUrl}>서비스 요청</a><a href={rfpUrl}>RFP·RFQ</a
        ><a href={quoteUrl}>견적</a>
      </nav>
      <div class="user">
        대한케미컬<span></span
        ><button class="logout" type="button" onclick={handleLogout}>
          <img src={logoutIconUrl} alt="" />로그아웃
        </button>
      </div>
    </header>
    <main>
      <a class="back" href={assetListUrl}
        ><span aria-hidden="true">←</span> 보유 설비 목록</a
      >
      <template if:true={loadError}
        ><aside class="data-notice" role="alert">{loadError}</aside></template
      >
      <template if:true={isPreview}
        ><aside class="data-notice" role="status">
          Builder 미리보기입니다. 실제 설비 상세는 보유 설비 목록에서 선택해
          확인해 주세요.
        </aside></template
      >
      <section class="asset-hero" aria-labelledby="asset-title">
        <div class="visuals">
          <img class="asset-image" src={heroImageUrl} alt={assetName} /><img
            class="blueprint"
            src={blueprintUrl}
            alt=""
          />
        </div>
        <div class="summary">
          <p class="model">{model}</p>
          <h1 id="asset-title">{assetName}</h1>
          <p class="serial">{serial}</p>
          <dl>
            <dt><img src={locationIconUrl} alt="" /></dt>
            <dd>{location}</dd>
            <dt><img src={statusIconUrl} alt="" /></dt>
            <dd>
              {status}
              <template if:true={hasHealthAlert}
                ><span class={healthBadgeClass} title={healthBadgeTitle}
                  >{healthBadgeLabel}</span
                ></template
              >
            </dd>
          </dl>
        </div>
        <div class="hero-actions">
          <a class="primary" href={serviceRequestHref}
            >서비스 요청 <span aria-hidden="true">→</span></a
          >
        </div>
      </section>
      <nav class="tabs" aria-label="설비 상세 영역">
        <a class="active" href="#basic">기본 정보</a
        ><a href="#history">서비스 이력</a><a href="#warranty">보증 현황</a>
      </nav>
      <section class="details" id="basic">
        <div class="specification">
          <h2>설비 정보</h2>
          <div class="specs">
            <dl>
              <dt>모델</dt>
              <dd>{model}</dd>
              <dt>설치일</dt>
              <dd>{installDate}</dd>
              <dt>누적 운전 시간</dt>
              <dd>{runtime}</dd>
              <dt>가동시간 기준일</dt>
              <dd>{runtimeDate}</dd>
            </dl>
            <dl>
              <dt>정비 단계</dt>
              <dd>{smartCare}</dd>
              <dt>다음 오버홀까지</dt>
              <dd>{overhaulHours}</dd>
              <dt>예상 교체 시점</dt>
              <dd>{replacementDate}</dd>
              <dt>일련번호</dt>
              <dd>{serial}</dd>
            </dl>
          </div>
        </div>
        <div class="warranty" id="warranty">
          <h2>보증 현황</h2>
          <div class="dates">
            <span>보증 시작<strong>{warrantyStart}</strong></span
            ><span class="today">오늘</span
            ><span>보증 종료<strong>{warrantyEnd}</strong></span>
          </div>
          <div class="timeline" aria-label="보증 기간 진행 현황">
            <i></i><span style={warrantyProgressStyle}></span>
          </div>
          <p>남은 보증 기간<strong>{warrantyRemaining}</strong></p>
          <div class="coverage">
            <span>부품 <b>{warrantyParts}</b></span
            ><span>공임 <b>{warrantyLabor}</b></span
            ><span>출장비 <b>{warrantyExpenses}</b></span>
          </div>
        </div>
      </section>
      <section class="history" id="history">
        <div class="history-heading">
          <h2>최근 서비스 이력</h2>
          <span>최근 3건 기준</span>
        </div>
        <div class="history-body">
          <template if:true={hasCases}
            ><table>
              <thead>
                <tr>
                  <th>요청번호</th>
                  <th>요청 내용</th>
                  <th>서비스 일시</th>
                  <th>상태</th>
                  <th>담당 엔지니어</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={cases} for:item="item"
                  ><tr key={item.id}>
                    <td>{item.number}</td>
                    <td>{item.subject}</td>
                    <td>{item.date}</td>
                    <td class="teal">{item.status}</td>
                    <td>{item.engineer}</td>
                  </tr></template
                >
              </tbody>
            </table></template
          ><template if:false={hasCases}
            ><p class="empty-history">
              등록된 서비스 이력이 없습니다.
            </p></template
          ><a href={serviceHistoryHref}
            >전체 서비스 이력 보기 <span aria-hidden="true">→</span></a
          >
        </div>
      </section>
    </main>
  </div>
</template>
