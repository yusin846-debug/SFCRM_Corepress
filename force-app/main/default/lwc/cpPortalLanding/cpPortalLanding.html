<template>
    <main class="portal" id="main-content">
        <header class="site-header">
            <a class="brand" href="#main-content" aria-label="CorePress 홈">
                <img src={headerLogoUrl} alt="CorePress" width="600" height="120" />
            </a>
            <nav class="site-nav" aria-label="주요 메뉴">
                <a href="#products">제품</a><a href="#service">서비스</a>
                <a href="#technology">기술자료</a><a href="#company">회사소개</a>
            </nav>
            <div class="utility-nav">
                <span class="locale">KR · EN</span>
                <a class="portal-link" href={loginUrl}><img src={portalUserIconUrl} alt="" />고객 포털</a>
            </div>
        </header>

        <section class="hero" aria-labelledby="hero-title">
            <img class="hero-image" src={coverImageUrl} alt="CorePress 압축기 설비를 점검하는 현장 엔지니어" width="1536" height="1024" />
            <div class="hero-overlay" aria-hidden="true"></div>
            <div class="hero-copy">
                <p class="eyebrow">DIGITAL SERVICE SOLUTION</p>
                <h1 id="hero-title">{heroTitle}</h1>
                <p class="hero-description">{heroDescription}</p>
                <div class="hero-actions">
                    <a class="button button-outline" href={loginUrl}>고객 포털 접속 <span aria-hidden="true">→</span></a>
                    <button class="text-action catalog-trigger" type="button" onclick={openCatalogModal}>카탈로그 보기 <span aria-hidden="true">→</span></button>
                </div>
            </div>
            <div class="hero-metrics" aria-label="서비스 상태 요약">
                <div class="metric metric-health"><span class="metric-symbol"><img src={healthIconUrl} alt="진동 파형" /></span><p><small>ASSET HEALTH</small><strong>98%</strong></p></div>
                <div class="metric metric-support"><span class="metric-symbol"><img src={supportIconUrl} alt="고객센터 상담원" /></span><p><strong>24/7</strong><small>REMOTE SUPPORT</small></p></div>
                <div class="metric metric-maintenance"><span class="metric-symbol"><img src={maintenanceIconUrl} alt="예지 정비" /></span><p><small>PREDICTIVE</small><strong>MAINTENANCE</strong></p></div>
            </div>
        </section>

        <section class="product-section" id="products" aria-labelledby="product-title">
            <div class="section-heading">
                <div><p class="section-kicker">PRODUCT LINEUP</p><h2 id="product-title">현장 조건에 맞는 압축기 라인업</h2></div>
                <a class="all-products" href="#technology">전체 제품 보기 <span aria-hidden="true">→</span></a>
            </div>
            <div class="product-showcase">
                <article class="product-stage" aria-live="polite">
                    <div class={productDisplayClass}>
                        <div class="product-visual">
                            <img src={selectedProduct.imageUrl} alt={selectedProduct.imageAlt} width="1024" height="1024" loading="lazy" />
                        </div>
                        <div class="product-caption">
                            <p>{selectedProduct.category}</p>
                            <h3>{selectedProduct.name}</h3>
                            <span>{selectedProduct.description}</span>
                            <a href="#technology">제품 자세히 보기 <span aria-hidden="true">→</span></a>
                        </div>
                    </div>
                    <div class="product-tabs" role="tablist" aria-label="제품 선택">
                        <template for:each={productTabs} for:item="product">
                            <button key={product.id} class={product.tabClass} type="button" role="tab" aria-selected={product.ariaSelected} data-product={product.id} onclick={selectProduct}>{product.name}</button>
                        </template>
                    </div>
                </article>
                <aside class="product-outcomes" aria-label="CorePress 회사 역량">
                    <div class="outcome-heading"><p>ABOUT COREPRESS</p><h3>압축 공정의 기준을<br />설계합니다</h3><span>설비 선정과 설치, 운전, 정비를 하나의 기술 흐름으로 연결합니다.</span></div>
                    <div class="company-proof" aria-label="CorePress 핵심 역량">
                        <div><strong>3</strong><p>핵심 제품 라인업</p><span>공정 규모와 운전 조건에 맞춘 제품 구성</span></div>
                        <div><strong>24/7</strong><p>서비스 대응 체계</p><span>현장 요청부터 예방정비까지 연결</span></div>
                        <div><strong>ONE</strong><p>생애주기 관리</p><span>설치, 보증, 서비스 이력의 통합 관리</span></div>
                    </div>
                    <p class="company-statement">기술과 현장 데이터를 바탕으로 설비가 멈추지 않는 운영 환경을 만듭니다.</p>
                </aside>
            </div>
        </section>
    </main>

    <template if:true={isCatalogModalOpen}>
        <section class="modal-backdrop" role="presentation" onclick={handleBackdropClick} onkeydown={handleModalKeydown}>
            <div class="catalog-modal" role="dialog" aria-modal="true" aria-label="카탈로그 문의">
                <button class="modal-close" type="button" aria-label="닫기" onclick={closeCatalogModal}>×</button>
                <template if:false={isCatalogSubmitted}>
                    <header class="modal-heading"><p>PRODUCT CATALOG</p><h2>카탈로그 문의</h2><span>관심 제품과 연락처를 남겨 주시면 제품 카탈로그를 안내해 드립니다.</span></header>
                    <form onsubmit={submitCatalogInquiry} novalidate>
                        <div class="form-grid">
                            <label><span>회사명 <em>필수</em></span><input class="first-field" name="company" type="text" autocomplete="organization" required /></label>
                            <label><span>담당자명 <em>필수</em></span><input name="name" type="text" autocomplete="name" required /></label>
                            <label><span>이메일 <em>필수</em></span><input name="email" type="email" autocomplete="email" required /></label>
                            <label><span>연락처 <em>필수</em></span><input name="phone" type="tel" autocomplete="tel" pattern="[0-9+() -]{8,20}" required /></label>
                            <label class="full"><span>관심 제품 <em>필수</em></span><select name="product" required><option value="">제품을 선택해 주세요</option><option>CP100 Pro</option><option>CP2100</option><option>CP7100+</option><option>전체 제품</option></select></label>
                            <label class="full">문의 내용<textarea name="message" rows="3" placeholder="적용 공정이나 필요한 사양을 입력해 주세요."></textarea></label>
                        </div>
                        <label class="consent"><input name="consent" type="checkbox" required /><span>카탈로그 제공을 위한 개인정보 수집 및 이용에 동의합니다. <em>필수</em></span></label>
                        <div class="modal-actions"><button class="cancel" type="button" onclick={closeCatalogModal}>취소</button><button class="submit" type="submit">문의 후 다운로드 <span aria-hidden="true">→</span></button></div>
                    </form>
                </template>
                <template if:true={isCatalogSubmitted}>
                    <div class="success-state"><span class="success-mark">✓</span><p>REQUEST COMPLETE</p><h2>문의가 접수되었습니다</h2><div>아래 버튼을 눌러 제품 카탈로그를 내려받을 수 있습니다.</div><template if:true={hasCatalogUrl}><a class="download" href={resolvedCatalogUrl} target="_blank" rel="noopener" download>카탈로그 다운로드 <span aria-hidden="true">↓</span></a></template><button class="close-complete" type="button" onclick={closeCatalogModal}>닫기</button></div>
                </template>
            </div>
        </section>
    </template>
</template>
