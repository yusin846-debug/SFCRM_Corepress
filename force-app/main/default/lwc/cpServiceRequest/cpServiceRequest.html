<template>
    <main class="request-page">
        <header class="request-header">
            <img src={headerLogoUrl} alt="CorePress" />
            <nav aria-label="고객 포털 메뉴"><a href={homeUrl}>홈</a><a href={assetListUrl}>보유 설비</a><span aria-current="page">서비스 요청</span><a href={rfpUrl}>RFP·RFQ</a><a href={quoteUrl}>견적</a></nav>
            <div class="account">{headerLabel}</div>
        </header>

        <template if:false={isSubmitted}>
            <section class="content" aria-labelledby="request-title">
                <div class="page-heading">
                    <p>SERVICE REQUEST</p>
                    <h1 id="request-title">서비스 요청 등록</h1>
                    <span>설비의 현재 상태와 증상을 알려주시면 담당자가 확인 후 신속히 연락드리겠습니다.</span>
                </div>

                <template if:true={contextNotice}><div class="form-message warning" role="status">{contextNotice}</div></template>
                <template if:true={submitError}><div class="form-message error" role="alert">{submitError}</div></template>

                <form onsubmit={handleSubmit} novalidate>
                    <div class="form-layout">
                        <div class="form-main">
                            <section class="form-section">
                                <div class="section-number">01</div>
                                <div class="section-content">
                                    <h2>대상 설비</h2>
                                    <p>서비스가 필요한 설비를 선택해 주세요.</p>
                                    <label class="field"><span>보유 설비 <em>필수</em></span><select name="asset" required value={selectedAssetId} onchange={handleAssetChange}><option value="">설비를 선택해 주세요</option><template for:each={assets} for:item="asset"><option key={asset.id} value={asset.id}>{asset.label}</option></template></select></label>
                                </div>
                            </section>

                            <section class="form-section">
                                <div class="section-number">02</div>
                                <div class="section-content">
                                    <h2>증상 및 시급도</h2>
                                    <p>현재 확인되는 증상과 공정 영향을 선택해 주세요.</p>
                                    <label class="field symptom-field"><span>증상 유형 <em>필수</em></span><select name="type" required><option value="">증상 유형 선택</option><option>소음·진동</option><option>토출압 저하</option><option>온도 상승</option><option>드레인 이상</option><option>누설</option><option>기타</option></select></label>
                                    <fieldset class="impact-group"><legend>공정 영향 및 희망 시급도 <em>필수</em></legend><div class="impact-options">
                                        <label class="impact"><input type="radio" name="impact" value="normal" required onchange={handleImpactChange} /><span><span class="impact-title"><strong>정상 운전 가능</strong><b>낮음</b></span><small>조업 영향 없이 운전 중</small></span></label>
                                        <label class="impact"><input type="radio" name="impact" value="limited" onchange={handleImpactChange} /><span><span class="impact-title"><strong>제한 운전 중</strong><b>보통</b></span><small>성능 저하 또는 감속 운전</small></span></label>
                                        <label class="impact"><input type="radio" name="impact" value="stopped" onchange={handleImpactChange} /><span><span class="impact-title"><strong>설비 정지</strong><b>긴급</b></span><small>현재 조업에 직접적인 영향 발생</small></span></label>
                                    </div></fieldset>
                                    <div class="urgency-adjust"><button type="button" onclick={toggleUrgencyOverride}>시급도 직접 조정 <span aria-hidden="true">{overrideIndicator}</span></button><span>{recommendationText}</span></div>
                                    <template if:true={showUrgencyOverride}><label class="field urgency-field"><span>희망 시급도 조정</span><select name="urgency" value={selectedUrgency} onchange={handleUrgencyChange}><option>긴급</option><option>보통</option><option>낮음</option></select></label></template>
                                </div>
                            </section>

                            <section class="form-section">
                                <div class="section-number">03</div>
                                <div class="section-content">
                                    <h2>요청 내용</h2>
                                    <p>담당자가 상황을 정확히 파악할 수 있도록 자세히 작성해 주세요.</p>
                                    <label class="field"><span>요청 제목 <em>필수</em></span><input name="subject" type="text" maxlength="255" placeholder="예: 운전 중 비정상 진동과 소음 발생" required /></label>
                                    <label class="field"><span>상세 내용 <em>필수</em></span><textarea name="description" rows="6" placeholder="증상 발생 시점, 빈도, 현재 운전 상태 등을 입력해 주세요." required></textarea></label>
                                    <div class="field"><span>현장 사진 및 자료 <small>선택</small></span><label class="file-upload"><input name="files" type="file" accept="image/*,.pdf" multiple onchange={handleFileChange} /><span class="file-button">파일 선택 <b aria-hidden="true">+</b></span><span class="file-name">{selectedFileLabel}</span></label><p class="file-help">이미지 또는 PDF, 최대 5개 · 파일당 2MB 이하</p></div>
                                </div>
                            </section>
                        </div>

                        <aside class="request-guide">
                            <p class="guide-label">REQUEST GUIDE</p>
                            <h2>접수 전 확인해 주세요</h2>
                            <ol><li><span>1</span><p><strong>설비를 확인합니다</strong><small>모델명과 시리얼 번호가 맞는지 확인해 주세요.</small></p></li><li><span>2</span><p><strong>증상을 구체적으로 적습니다</strong><small>발생 시점과 반복 여부를 함께 알려주세요.</small></p></li><li><span>3</span><p><strong>담당자가 접수 내용을 검토합니다</strong><small>접수 후 진행 상황은 포털에서 확인할 수 있습니다.</small></p></li></ol>
                            <div class="support-note"><strong>긴급 지원이 필요하신가요?</strong><span>설비 정지 등 긴급 상황은 접수 후 고객센터로 연락해 주세요.</span><a href="tel:15880000">1588-0000</a></div>
                        </aside>
                    </div>
                    <div class="form-actions"><button class="cancel" type="button" onclick={handleCancel}>취소</button><button class="submit" type="submit" disabled={isSubmitting}><span>서비스 요청 접수</span><b aria-hidden="true">→</b></button></div>
                </form>
            </section>
        </template>

        <template if:true={isSubmitted}>
            <section class="success" aria-live="polite"><div class="success-icon">✓</div><p>REQUEST RECEIVED</p><h1>서비스 요청이 접수되었습니다</h1><span>담당자가 내용을 확인한 뒤 등록된 연락처로 안내드리겠습니다.</span><dl><div><dt>접수 상태</dt><dd>신규접수</dd></div><div><dt>접수 경로</dt><dd>고객 포털</dd></div><div><dt>예상 안내</dt><dd>영업시간 기준 2시간 이내</dd></div></dl><button type="button" onclick={resetForm}>새 요청 등록</button></section>
        </template>
    </main>
</template>
